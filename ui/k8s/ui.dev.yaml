# block / ui in the LOCAL dev cluster (`skaffold dev` in ui/, routines dev, dev_keep, delete): the web app (Vite; prod builds at start).
# Same Dockerfile as prod, APP_ENV=dev.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: block
spec:
  replicas: 1
  selector:
    matchLabels: { app: ui }
  template:
    metadata:
      labels: { app: ui }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ui
          image: block-ui
          env:
            - { name: APP_ENV, value: dev }
          ports: [{ name: http, containerPort: 5106 }]
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: block-ui
  namespace: block
spec:
  selector: { app: ui }
  ports: [{ name: http, port: 5106, targetPort: http }]
