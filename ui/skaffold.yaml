# block / ui, dev on Kubernetes (routines dev, dev_keep, delete): the web app.
# Prepares the namespace (../k8s/dev-setup.sh), deploys to the current kube
# context and streams only this app's logs. Forwards localhost:5106.
# Hot reload: edits matching sync are copied into the running container (infer, from the Dockerfile COPY lines);
# any other change rebuilds the image.
# Prod is deployed by GitHub Actions only, never from here.
apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: ui
build:
  local:
    push: false                      # no registry: the cluster on the Docker host uses the image directly
  tagPolicy:
    sha256: {}
  artifacts:
    - image: block-ui
      context: ..                    # the repo root, so lib/ (the package itself) is in the build
      docker:
        dockerfile: ui/docker/Dockerfile
      sync:
        infer:
          - lib/app/src/**
          - ui/app/src/**
          - ui/app/public/**
          - ui/app/index.html
manifests:
  rawYaml: [k8s/ui.dev.yaml]
deploy:                              # no kubeContext: the current one
  kubectl:
    hooks:
      before:
        - host:
            command: ["bash", "../k8s/dev-setup.sh"]
portForward:
  - resourceType: service
    resourceName: block-ui
    namespace: block
    port: 5106
    localPort: 5106
