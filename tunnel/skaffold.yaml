# block / tunnel, dev on Kubernetes (routines dev, dev_keep, delete): https://block.ghostmind.app -> the mcp and
# ui apps, by path. Prepares the namespace, the credentials volume and a dev-session Vault token
# (../k8s/dev-setup.sh), deploys to the current kube context and streams only this app's logs.
# A change under tunnel/ rebuilds and redeploys; there is no source to sync. Ctrl-C removes the tunnel only (the volume stays).
# Prod is deployed by GitHub Actions only, never from here.
apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: tunnel
build:
  local:
    push: false                      # no registry: the cluster on the Docker host uses the image directly
  tagPolicy:
    sha256: {}
  artifacts:
    - image: block-tunnel
      context: .
      docker:
        dockerfile: docker/Dockerfile
manifests:
  rawYaml: [k8s/tunnel.dev.yaml]
deploy:                              # no kubeContext: the current one
  kubectl:
    hooks:
      before:
        - host:
            command: ["bash", "../k8s/dev-setup.sh"]
