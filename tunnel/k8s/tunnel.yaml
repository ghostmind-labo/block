# block / tunnel in the k3s cluster (namespace block): cloudflared running the existing tunnel block-prod.
# Two copies on different servers = two connectors; Cloudflare uses whichever is up. Outbound only, no Service.
# Secrets: the pod's service-account token (audience vault) is traded for a Vault token (auth/k8s, role
# block-tunnel) by varlock at start. Deployed by .github/workflows/deploy.yaml, which replaces IMAGE.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tunnel
  namespace: block
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tunnel
  namespace: block
spec:
  replicas: 2
  selector:
    matchLabels: { app: tunnel }
  template:
    metadata:
      labels: { app: tunnel }
    spec:
      serviceAccountName: tunnel
      imagePullSecrets: [{ name: ghcr }]
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app: tunnel } } }
      containers:
        - name: tunnel
          image: IMAGE
          env:
            - { name: APP_ENV, value: prod }
            - { name: VAULT_ADDR, value: "http://10.0.0.7:8200" }    # Vault over the Hetzner private network
            - { name: VAULT_JWT_ROLE, value: block-tunnel }
          volumeMounts:
            - { name: vault-token, mountPath: /var/run/secrets/vault, readOnly: true }
            - { name: tmp, mountPath: /tmp }                       # the tunnel credentials, in RAM only
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 10m, memory: 48Mi }
            limits: { memory: 256Mi }
          startupProbe:
            exec: { command: ["wget", "-qO-", "http://127.0.0.1:20241/ready"] }
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            exec: { command: ["wget", "-qO-", "http://127.0.0.1:20241/ready"] }
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: vault-token
          projected:
            sources:
              - serviceAccountToken: { audience: vault, expirationSeconds: 600, path: token }
        - name: tmp
          emptyDir: { medium: Memory }
