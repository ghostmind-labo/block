# Prod: tunnel block-prod (created by k8s/prod-init.sh; its credentials are in Vault).
# One host, by path, most specific first: the MCP, the sign-in it carries and the API the web app reads go to
# the mcp app, everything else (the pages) to the ui app.
tunnel: block-prod

ingress:
  - hostname: block.ghostmind.dev
    path: ^/mcp(/.*)?$
    service: http://block-mcp:3105
  - hostname: block.ghostmind.dev
    path: ^/oauth/.*$
    service: http://block-mcp:3105
  - hostname: block.ghostmind.dev
    path: ^/\.well-known/oauth-.*$
    service: http://block-mcp:3105
  - hostname: block.ghostmind.dev
    path: ^/api/.*$
    service: http://block-mcp:3105
  - hostname: block.ghostmind.dev
    service: http://block-ui:5106
  - service: http_status:404
