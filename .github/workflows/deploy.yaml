# Deploys block to the k3s cluster (namespace block). A merge to main deploys only the apps it changed (mcp and
# ui are built from the repo root, so a change in lib/ deploys both); a run started by hand, or a change to
# these workflows, deploys everything in order: the db first (it applies migrations and metadata at start),
# then the mcp, the ui, and the tunnel last, so nothing sends traffic to an app that isn't there.
# Images are built here, pushed to GHCR, applied by digest.
name: deploy
on:
  push:
    branches: [main]
    paths: [db/**, mcp/**, ui/**, lib/**, tunnel/**, .dockerignore, .github/workflows/deploy.yaml, .github/workflows/_deploy-k8s.yaml, .github/workflows/changes.sh]
  workflow_dispatch:
    inputs:
      apps: { description: "all, or the apps to deploy, separated by spaces (mcp ui)", default: all }
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    outputs: { db: "${{ steps.pick.outputs.db }}", mcp: "${{ steps.pick.outputs.mcp }}", ui: "${{ steps.pick.outputs.ui }}", tunnel: "${{ steps.pick.outputs.tunnel }}" }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: pick
        env: { ASKED: "${{ inputs.apps }}", BEFORE: "${{ github.event.before }}" }
        run: bash .github/workflows/changes.sh db mcp+lib ui+lib tunnel >> "$GITHUB_OUTPUT"
  db:
    needs: changes
    if: needs.changes.outputs.db == 'true'
    uses: ./.github/workflows/_deploy-k8s.yaml
    permissions: { contents: read, packages: write, id-token: write }
    secrets: inherit
    with: { project: block, app: db, context: db, dockerfile: db/docker/Dockerfile, manifest: db/k8s/db.yaml }
  mcp:
    needs: [changes, db]
    # a job whose `needs` was skipped is skipped too, unless it says otherwise: run after db when db ran, alone when it did not
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.mcp == 'true' }}
    uses: ./.github/workflows/_deploy-k8s.yaml
    permissions: { contents: read, packages: write, id-token: write }
    secrets: inherit
    with: { project: block, app: mcp, context: ., dockerfile: mcp/docker/Dockerfile, manifest: mcp/k8s/mcp.yaml }
  ui:
    needs: [changes, mcp]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.ui == 'true' }}
    uses: ./.github/workflows/_deploy-k8s.yaml
    permissions: { contents: read, packages: write, id-token: write }
    secrets: inherit
    with: { project: block, app: ui, context: ., dockerfile: ui/docker/Dockerfile, manifest: ui/k8s/ui.yaml }
  tunnel:
    needs: [changes, ui]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.tunnel == 'true' }}
    uses: ./.github/workflows/_deploy-k8s.yaml
    permissions: { contents: read, packages: write, id-token: write }
    secrets: inherit
    with: { project: block, app: tunnel, context: tunnel, dockerfile: tunnel/docker/Dockerfile, manifest: tunnel/k8s/tunnel.yaml }
