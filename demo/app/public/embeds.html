<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The page's own policy, as an app shows blocks: PAGE_POLICY from the package (a test keeps the two equal). -->
<meta http-equiv="Content-Security-Policy" content="frame-src https://www.youtube-nocookie.com/embed/ https://www.youtube.com/embed/ https://player.vimeo.com/video/ https://open.spotify.com/embed/ https://embed.reddit.com/r/ https://www.instagram.com/p/ https://www.instagram.com/reel/">
<title>block embeds</title>
<style>
  :root { --paper: #faf9f6; --ink: #26262a; --muted: #77777c; --line: #dcdbd6; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --paper: #111111; --ink: #e6e6e6; --muted: #8a8a8f; --line: #2a2a2a; } }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.6 ui-sans-serif, system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 48px 20px 120px; }
  h1 { font-size: 28px; margin: 0 0 8px; }
  h2 { font-size: 17px; margin: 40px 0 8px; }
  p { color: var(--muted); margin: 0 0 12px; }
</style>
</head>
<body>
<main>
  <h1>Players inside a block</h1>
  <p>Each block below is the same sandbox every app uses. It shows a player from the closed list in the package (<code>EMBEDS</code>), written with the address a note would take.</p>
  <div id="blocks"></div>
</main>
<script type="module">
  import { mount } from "/block/mount.js";
  const players = {
    YouTube: "https://youtu.be/d6c6uIyieoo",
    Vimeo: "https://vimeo.com/76979871",
    Spotify: "https://open.spotify.com/track/4cOdK2wGLETKBW3PvgPWqT",
    Reddit: "https://www.reddit.com/r/IAmA/comments/z1c9z/i_am_barack_obama_president_of_the_united_states/",
    Instagram: "https://www.instagram.com/p/BsOGulcndj-/",
  };
  const blocks = document.getElementById("blocks");
  // A video with its own timestamps: the block moves the player it shows.
  const chapters = `<style>
  nav { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  button { font: 13px system-ui, sans-serif; padding: 6px 10px; border-radius: 8px; border: 1px solid #8884; background: transparent; color: inherit; cursor: pointer; }
</style>
<block-embed id="video" src="https://youtu.be/d6c6uIyieoo" title="Riemann Hypothesis - Numberphile"></block-embed>
<nav>
  <button data-at="0">Start</button><button data-at="125">2:05 the primes</button><button data-at="420">7:00 the zeta function</button><button data-pause>Pause</button>
</nav>
<script>
  const video = document.querySelector("#video");
  document.querySelector("nav").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.hasAttribute("data-pause")) return video.pause();
    video.seek(Number(b.dataset.at));
    video.play();
  });
<\/script>`;
  {
    const h = document.createElement("h2");
    h.textContent = "Timestamps that move the player";
    const box = document.createElement("div");
    blocks.append(h, box);
    await mount(box, chapters, { title: "Chapters" });
  }
  for (const [name, url] of Object.entries(players)) {
    const h = document.createElement("h2");
    h.textContent = name;
    const box = document.createElement("div");
    blocks.append(h, box);
    await mount(box, `<block-embed src="${url}"></block-embed>`, { title: name });
  }
</script>
</body>
</html>
