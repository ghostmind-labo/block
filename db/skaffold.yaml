# block / db, dev on Kubernetes: `skaffold dev` here (routines dev, dev_keep, start, delete). Builds the image,
# prepares the namespace and a dev-session Vault token (../k8s/dev-setup.sh), deploys k8s/db.dev.yaml to the
# current kube context (it names no cluster) and streams only this app's logs. Forwards localhost:5107.
# Migrations and metadata are applied with the routine migrate. Any change here rebuilds and redeploys.
# Prod is deployed by GitHub Actions only, never from here.
apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: db
build:
  local:
    push: false                      # the image stays in the dev machine's Docker; its cluster uses it directly
  tagPolicy:
    sha256: {}
  artifacts:
    - image: block-db
      context: .
      docker:
        dockerfile: docker/Dockerfile
manifests:
  rawYaml: [k8s/db.dev.yaml]
deploy:                              # no kubeContext: the current one
  kubectl:
    hooks:
      before:
        - host:
            command: ["bash", "../k8s/dev-setup.sh"]
portForward:
  - resourceType: service
    resourceName: block-db
    namespace: block
    port: 5107
    localPort: 5107
