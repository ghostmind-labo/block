# block / db in the dev cluster (`skaffold dev` in db/, routines dev, dev_keep, delete): Hasura on the shared Postgres (the db project).
# Same Dockerfile as prod, APP_ENV=dev. Vault: the 12h dev-session token in Secret vault-dev (k8s/dev-setup.sh).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: block
spec:
  replicas: 1
  selector:
    matchLabels: { app: db }
  template:
    metadata:
      labels: { app: db }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: db
          image: block-db
          env:
            - { name: APP_ENV, value: dev }
            - name: VAULT_ADDR
              valueFrom: { secretKeyRef: { name: vault-dev, key: VAULT_ADDR } }
            - name: VAULT_TOKEN
              valueFrom: { secretKeyRef: { name: vault-dev, key: VAULT_TOKEN } }
          ports: [{ name: http, containerPort: 5107 }]
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: block-db
  namespace: block
spec:
  selector: { app: db }
  ports: [{ name: http, port: 5107, targetPort: http }]
