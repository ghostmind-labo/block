# block / db in the k3s cluster (prod, namespace block): Hasura on the shared Postgres (the db project).
# Deployed by .github/workflows/deploy.yaml, which replaces IMAGE with the built digest. Dev: k8s/db.dev.yaml.
# Secrets: the pod's service-account token (audience vault) is traded for a Vault token (auth/k8s, role block-db).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db
  namespace: block
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: block
spec:
  replicas: 1
  strategy: { type: Recreate }    # one instance applies migrations
  selector:
    matchLabels: { app: db }
  template:
    metadata:
      labels: { app: db }
    spec:
      serviceAccountName: db
      imagePullSecrets: [{ name: ghcr }]
      containers:
        - name: db
          image: IMAGE
          env:
            - { name: APP_ENV, value: prod }
            - { name: VAULT_ADDR, value: "http://10.0.0.7:8200" }    # Vault over the Hetzner private network
            - { name: VAULT_JWT_ROLE, value: block-db }
          ports: [{ name: http, containerPort: 5107 }]
          volumeMounts:
            - { name: vault-token, mountPath: /var/run/secrets/vault, readOnly: true }
            - { name: tmp, mountPath: /tmp }
            - { name: hasura-cli, mountPath: /root/.hasura }       # hasura-cli's config dir (migrations)
            - { name: seeds, mountPath: /hasura-project/seeds }    # hasura-cli insists on creating it
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 20m, memory: 192Mi }
            limits: { memory: 512Mi }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: vault-token
          projected:
            sources:
              - serviceAccountToken: { audience: vault, expirationSeconds: 600, path: token }
        - { name: tmp, emptyDir: {} }
        - { name: hasura-cli, emptyDir: {} }
        - { name: seeds, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: block-db
  namespace: block
spec:
  selector: { app: db }
  ports: [{ name: http, port: 5107, targetPort: http }]
