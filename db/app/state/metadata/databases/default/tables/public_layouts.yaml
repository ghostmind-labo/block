table:
  name: layouts
  schema: public
array_relationships:
  - name: blocks
    using:
      foreign_key_constraint_on:
        column: layout_id
        table:
          name: blocks
          schema: public
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: x-hasura-User-Id
      columns:
        - name
        - source
        - room
        - fields
        - sample
select_permissions:
  - role: user
    permission:
      columns: '*'
      filter:
        user_id:
          _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - name
        - source
        - room
        - fields
        - sample
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check:
        user_id:
          _eq: X-Hasura-User-Id
delete_permissions:
  - role: user
    permission:
      filter:
        user_id:
          _eq: X-Hasura-User-Id
