table:
  name: blocks
  schema: public
object_relationships:
  - name: layout
    using:
      foreign_key_constraint_on: layout_id
  - name: user
    using:
      foreign_key_constraint_on: user_id
array_relationships:
  - name: made_from
    using:
      foreign_key_constraint_on:
        column: layout_id
        table:
          name: blocks
          schema: public
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: x-hasura-User-Id
      columns:
        - name
        - source
        - slot
        - shared
        - sample
        - room
        - fields
        - layout_id
select_permissions:
  - role: public
    permission:
      columns:
        - id
        - name
        - source
        - slot
        - sample
        - room
        - fields
        - layout_id
        - updated_at
      filter:
        shared:
          _eq: true
    comment: anyone reads a block its owner shared, and never whose it is
  - role: user
    permission:
      columns: '*'
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      allow_aggregations: true
update_permissions:
  - role: user
    permission:
      columns:
        - name
        - source
        - slot
        - shared
        - sample
        - room
        - fields
        - layout_id
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check:
        user_id:
          _eq: X-Hasura-User-Id
delete_permissions:
  - role: user
    permission:
      filter:
        user_id:
          _eq: X-Hasura-User-Id
