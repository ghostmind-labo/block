table:
  name: drafts
  schema: public
object_relationships:
  - name: block
    using:
      foreign_key_constraint_on: block_id
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: x-hasura-User-Id
      columns:
        - source
        - name
        - slot
        - sample
        - room
        - block_id
select_permissions:
  - role: user
    permission:
      columns: '*'
      filter:
        user_id:
          _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - source
        - name
        - slot
        - sample
        - room
        - block_id
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check:
        user_id:
          _eq: X-Hasura-User-Id
delete_permissions:
  - role: user
    permission:
      filter:
        user_id:
          _eq: X-Hasura-User-Id
