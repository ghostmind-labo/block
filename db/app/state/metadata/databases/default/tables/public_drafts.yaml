table:
  name: drafts
  schema: public
object_relationships:
  - name: base
    using:
      foreign_key_constraint_on: based_on
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: x-hasura-User-Id
      columns:
        - source
        - name
        - slot
        - based_on
        - sample
        - room
        - fields
select_permissions:
  - role: user
    permission:
      columns: '*'
      filter:
        user_id:
          _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - source
        - name
        - slot
        - based_on
        - sample
        - room
        - fields
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check:
        user_id:
          _eq: X-Hasura-User-Id
delete_permissions:
  - role: user
    permission:
      filter:
        user_id:
          _eq: X-Hasura-User-Id
