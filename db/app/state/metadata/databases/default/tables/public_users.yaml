table:
  name: users
  schema: public
array_relationships:
  - name: blocks
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: blocks
          schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - email
        - name
        - picture
        - created_at
        - updated_at
      filter:
        id:
          _eq: X-Hasura-User-Id
    comment: a user sees only themselves
