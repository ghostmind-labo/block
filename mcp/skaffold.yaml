# block / mcp, dev on Kubernetes (routines dev, dev_keep, delete): the remote MCP + the API the web app uses.
# Prepares the namespace and a dev-session Vault token (../k8s/dev-setup.sh), deploys to the current kube
# context and streams only this app's logs. Forwards localhost:3105.
# Hot reload: edits matching sync are copied into the running container (infer, from the Dockerfile COPY lines);
# any other change rebuilds the image.
# Prod is deployed by GitHub Actions only, never from here.
apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: mcp
build:
  local:
    push: false                      # no registry: the cluster on the Docker host uses the image directly
  tagPolicy:
    sha256: {}
  artifacts:
    - image: block-mcp
      context: ..                    # the repo root, so lib/ (the package itself) is in the build
      docker:
        dockerfile: mcp/docker/Dockerfile
      sync:
        infer:
          - lib/app/src/**
          - mcp/app/src/**
manifests:
  rawYaml: [k8s/mcp.dev.yaml]
deploy:                              # no kubeContext: the current one
  kubectl:
    hooks:
      before:
        - host:
            command: ["bash", "../k8s/dev-setup.sh"]
portForward:
  - resourceType: service
    resourceName: block-mcp
    namespace: block
    port: 3105
    localPort: 3105
