# block / mcp in the LOCAL dev cluster (`skaffold dev` in mcp/, routines dev, dev_keep, delete): the remote MCP + the API the web app uses.
# Same Dockerfile as prod, APP_ENV=dev. Vault: the 12h dev-session token in Secret vault-dev (k8s/dev-setup.sh).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
  namespace: block
spec:
  replicas: 2
  selector:
    matchLabels: { app: mcp }
  template:
    metadata:
      labels: { app: mcp }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mcp
          image: block-mcp
          env:
            - { name: APP_ENV, value: dev }
            - name: VAULT_ADDR
              valueFrom: { secretKeyRef: { name: vault-dev, key: VAULT_ADDR } }
            - name: VAULT_TOKEN
              valueFrom: { secretKeyRef: { name: vault-dev, key: VAULT_TOKEN } }
          ports: [{ name: http, containerPort: 3105 }]
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: block-mcp
  namespace: block
spec:
  selector: { app: mcp }
  ports: [{ name: http, port: 3105, targetPort: http }]
