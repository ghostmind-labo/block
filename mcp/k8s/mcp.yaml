# block / mcp in the k3s cluster (prod, namespace block): the remote MCP + the API the web app uses.
# Deployed by .github/workflows/deploy.yaml, which replaces IMAGE with the built digest. Dev: k8s/mcp.dev.yaml.
# Secrets: the pod's service-account token (audience vault) is traded for a Vault token (auth/k8s, role block-mcp).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp
  namespace: block
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
  namespace: block
spec:
  replicas: 2
  selector:
    matchLabels: { app: mcp }
  template:
    metadata:
      labels: { app: mcp }
    spec:
      serviceAccountName: mcp
      imagePullSecrets: [{ name: ghcr }]
      topologySpreadConstraints:      # the copies on different servers
        - { maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app: mcp } } }
      containers:
        - name: mcp
          image: IMAGE
          env:
            - { name: APP_ENV, value: prod }
            - { name: VAULT_ADDR, value: "http://10.0.0.7:8200" }    # Vault over the Hetzner private network
            - { name: VAULT_JWT_ROLE, value: block-mcp }
            - { name: HOME, value: /tmp }                        # npm writes its logs under HOME
          ports: [{ name: http, containerPort: 3105 }]
          volumeMounts:
            - { name: vault-token, mountPath: /var/run/secrets/vault, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { memory: 256Mi }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: vault-token
          projected:
            sources:
              - serviceAccountToken: { audience: vault, expirationSeconds: 600, path: token }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: block-mcp
  namespace: block
spec:
  selector: { app: mcp }
  ports: [{ name: http, port: 3105, targetPort: http }]
